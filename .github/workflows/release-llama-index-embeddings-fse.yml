name: Release llama-index-embeddings-fse

on:
  push:
    tags: ["llama-index-embeddings-fse-v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify master ancestry and exact package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/master
          python3 - <<'PYTHON'
          import os, tomllib
          with open("integrations/llama-index-embeddings-fse/pyproject.toml", "rb") as file:
              project = tomllib.load(file)["project"]
          assert project["name"] == "llama-index-embeddings-fse"
          assert os.environ["RELEASE_TAG"] == "llama-index-embeddings-fse-v" + project["version"]
          PYTHON
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv build integrations/llama-index-embeddings-fse --out-dir dist
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-llama-index-embeddings-fse
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Configure required reviewers and prevent self-review before registering
    # the matching PyPI publisher. See integrations/README.md.
    environment: release-llama-index-embeddings-fse
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist-llama-index-embeddings-fse
          path: dist
      - name: Publish approved artifacts through PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
