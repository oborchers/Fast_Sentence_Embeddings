name: CI

on:
  push:
    branches: [master]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    # Monthly run against the newest dependency versions, so breakage from
    # numpy, scipy or gensim releases shows up without active development.
    - cron: "0 6 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COLUMNS: 150
  # The scheduled run resolves the newest versions instead of the lockfile.
  UV_SYNC_FLAGS: ${{ github.event_name == 'schedule' && '--upgrade' || '--locked' }}

jobs:
  # Whether a pull request changes more than documentation: one that touches only docs/
  # and Markdown files (README.md excepted, it is the package's description) skips the
  # jobs below; check still runs and passes. Pushes, tags and the monthly run test all.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "origin/$BASE...HEAD")
          echo "$files"
          other=$(echo "$files" | grep -vE '^docs/|\.md$' || true)  # files beyond the docs
          if [ -n "$other" ] || echo "$files" | grep -qx 'README.md'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
      - run: uv sync $UV_SYNC_FLAGS --group lint
      - run: make format-check
      - run: make lint
      - name: The ratchet of the guardrails does not grow against the base branch
        if: github.event_name == 'pull_request'
        run: uv run python tools/check_guardrails.py --base "origin/${{ github.base_ref }}"
      - name: Tests of the guardrail checker with its tools installed
        run: uv run --group test pytest tests/test_check_guardrails.py -p no:cacheprovider
      - run: make typecheck

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        deps: ["latest"]
        # A pull request tests macOS on 3.13 only: its wheel jobs test 3.11 and 3.15 on
        # Apple silicon and Intel, and macOS runners are scarce. master and tags test all.
        exclude: ${{ github.event_name == 'pull_request' && fromJSON('[{"os":"macos-latest","python-version":"3.11"},{"os":"macos-latest","python-version":"3.12"},{"os":"macos-latest","python-version":"3.14"},{"os":"macos-latest","python-version":"3.15"}]') || fromJSON('[]') }}
        include:
          # Lowest supported versions, matching the bounds in pyproject.toml.
          - os: ubuntu-latest
            python-version: "3.11"
            deps: "min"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - run: uv sync $UV_SYNC_FLAGS --group test --python ${{ matrix.python-version }}
      - name: Pin minimum dependencies
        if: matrix.deps == 'min'
        run: >-
          uv pip install
          "numpy==1.26.4" "pydantic==2.5.0" "xxhash==3.2.0" "gensim==4.3.3" "safetensors==0.4.0"
          "scikit-learn==1.5.0"
      - name: Run tests with coverage
        if: matrix.deps != 'min'
        run: make test-cov
        env:
          COVERAGE_FILE: .coverage.${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.deps }}
      - name: Run tests with coverage on minimum dependencies
        if: matrix.deps == 'min'
        run: make test-cov
        env:
          # Keep the pinned minimum versions instead of re-syncing the lockfile.
          UV_NO_SYNC: "1"
          COVERAGE_FILE: .coverage.${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.deps }}
      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.deps }}
          path: .coverage.*
          include-hidden-files: true
          retention-days: 7

  # The mlx backend on Apple silicon. The probe prints whether this runner has Metal (a
  # GitHub macOS runner is a virtual machine; GitHub documents GPU access only for its
  # larger paid runners) and the canary's result. Where Metal works the tests must run
  # the backend (FSE_REQUIRE_MLX), otherwise its tests skip with the reason and the
  # maintainer's `make test-mlx` on an Apple silicon Mac is the gate. The lockfile pins
  # mlx at its lower bound, 0.32.4, so this job also tests the minimum version.
  test-mlx:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync $UV_SYNC_FLAGS --group test --group mlx --python 3.13
      - name: Probe Metal and the canary
        id: probe
        run: |
          uv run python - <<'PY'
          import os
          import mlx.core as mx
          metal = mx.metal.is_available()
          print("mlx", mx.__version__, "Metal available:", metal)
          if metal:
              print(mx.device_info())
              from fse._backends import get_backend
              backend = get_backend("mlx")
              backend.device.ready()  # the canary, which every prepare runs once per process
              print("canary: passed")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"metal={'true' if metal else 'false'}\n")
          PY
      - name: Run tests with coverage, the mlx backend required where Metal works
        run: make test-cov
        env:
          FSE_REQUIRE_MLX: ${{ steps.probe.outputs.metal == 'true' && '1' || '' }}
          COVERAGE_FILE: .coverage.macos-mlx
      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-macos-mlx
          path: .coverage.*
          include-hidden-files: true
          retention-days: 7

  coverage:
    needs: [changes, test, test-mlx]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - run: uv sync --locked --group test
      - name: Download coverage artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine coverage
        run: |
          uv run coverage combine
          uv run coverage report

  sdist:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
      - run: uv build --sdist
      - run: uv run --no-project --with twine twine check dist/*
      - name: Install the sdist into a clean environment and run the tests
        run: |
          uv venv --python 3.13 /tmp/sdist-env
          uv pip install --python /tmp/sdist-env "$(ls dist/*.tar.gz)[gensim]" pytest
          /tmp/sdist-env/bin/python -m pytest tests -m "not network" -p no:cacheprovider
      - name: Use the sdist without gensim
        run: |
          uv venv --python 3.13 /tmp/plain-env
          uv pip install --python /tmp/plain-env dist/*.tar.gz
          cd /tmp && /tmp/plain-env/bin/python -c "
          import importlib.util, tempfile, pathlib, numpy as np
          for name in ('gensim', 'scipy'):
              assert importlib.util.find_spec(name) is None, name + ' is installed'
          assert importlib.util.find_spec('xxhash') is not None, 'xxhash is not installed'
          import fse
          from fse import _native, _reference
          from fse._contract import Batch
          wv = fse.WordVectors.from_arrays(np.ones((2, 3), np.float32), words=['a', 'b']).quantize('int8')
          path = pathlib.Path(tempfile.mkdtemp()) / 'wv.safetensors'
          wv.save(path)
          assert wv.fingerprint.startswith('xxh3-128:'), wv.fingerprint
          for mmap in (False, True):
              assert fse.WordVectors.load(path, mmap=mmap).fingerprint == wv.fingerprint
          batch = Batch(0, np.array([0, 2], np.int64), np.array([0, 1], np.uint32))
          args = (wv.stored_vectors, np.ones(2, np.float32), wv.scales)
          got, want = _native.pool_weighted_mean(batch, *args), _reference.pool_weighted_mean(batch, *args)
          assert got.view(np.uint32).tolist() == want.view(np.uint32).tolist()
          encoder = fse.Encoder.from_word_vectors(wv)
          rows = encoder.encode(['a b', 'b'])
          assert rows.shape == (2, 3), rows.shape
          encoder.save(path.with_name('encoder.safetensors'))
          loaded = fse.Encoder.load(path.with_name('encoder.safetensors'), mmap=True)
          assert loaded.encode(['a b', 'b']).tobytes() == rows.tobytes()
          try:
              fse.uSIF
          except AttributeError as err:
              assert 'fse==1.1.0' in str(err), err
          else:
              raise AssertionError('the 1.x uSIF exists')
          print('fse without gensim and scipy works')
          "
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          retention-days: 7

  wheels:
    name: wheels (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
        # A pull request skips the macOS Intel wheels: Linux tests the x86 code, Apple
        # silicon the macOS code, and the Intel runners are the slowest and scarcest.
        # master and tags build and test them before every release.
        exclude: ${{ github.event_name == 'pull_request' && fromJSON('[{"os":"macos-15-intel"}]') || fromJSON('[]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - uses: pypa/cibuildwheel@b9e566a2b284570af229f6c2a33673410d0389a3  # v4.3.4
        env:
          # A pull request builds every wheel but tests those of the oldest and the newest
          # Python; the test jobs cover the versions between. master and tags test all.
          CIBW_TEST_SKIP: ${{ github.event_name == 'pull_request' && 'cp312-* cp313-* cp314-*' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          retention-days: 7

  check:
    if: always()
    needs: [changes, lint, test, test-mlx, coverage, sdist, wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35  # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          # A documentation-only pull request skips them on purpose.
          allowed-skips: ${{ needs.changes.outputs.code == 'false' && 'lint, test, test-mlx, coverage, sdist, wheels' || '' }}

  release:
    needs: check
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download sdist and wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          skip-existing: true
