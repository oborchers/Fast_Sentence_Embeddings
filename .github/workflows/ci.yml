name: CI

on:
  push:
    branches: [master]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    # Monthly run against the newest dependency versions, so breakage from
    # numpy, scipy or gensim releases shows up without active development.
    - cron: "0 6 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COLUMNS: 150
  # The scheduled run resolves the newest versions instead of the lockfile.
  UV_SYNC_FLAGS: ${{ github.event_name == 'schedule' && '--upgrade' || '--locked' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
      - run: uv sync $UV_SYNC_FLAGS --group lint
      - run: make format-check
      - run: make lint
      - run: make typecheck

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
        deps: ["latest"]
        include:
          # Lowest supported versions, matching the bounds in pyproject.toml.
          - os: ubuntu-latest
            python-version: "3.11"
            deps: "min"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - run: uv sync $UV_SYNC_FLAGS --group test --python ${{ matrix.python-version }}
      - name: Pin minimum dependencies
        if: matrix.deps == 'min'
        run: >-
          uv pip install
          "numpy==1.26.4" "scipy==1.11.4" "gensim==4.3.3"
          "smart_open==6.4.0" "wordfreq==3.1.0" "huggingface-hub==0.23.0"
          "psutil==5.9.0" "pydantic==2.5.0" "threadpoolctl==3.1.0"
      - name: Run tests with coverage
        if: matrix.deps != 'min'
        run: make test-cov
        env:
          COVERAGE_FILE: .coverage.${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.deps }}
      - name: Run tests with coverage on minimum dependencies
        if: matrix.deps == 'min'
        run: make test-cov
        env:
          # Keep the pinned minimum versions instead of re-syncing the lockfile.
          UV_NO_SYNC: "1"
          COVERAGE_FILE: .coverage.${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.deps }}
      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.deps }}
          path: .coverage.*
          include-hidden-files: true
          retention-days: 7

  coverage:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - run: uv sync --locked --group test
      - name: Download coverage artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine coverage
        run: |
          uv run coverage combine
          uv run coverage report

  # gensim cannot be built on Python 3.14 yet (piskvorky/gensim#3640). This job
  # only reports when that changes and never blocks a merge or release.
  python-314:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --upgrade --group test --python 3.14
      - run: make test

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
      - run: uv build --sdist
      - run: uv run --no-project --with twine twine check dist/*
      - name: Install the sdist into a clean environment and run the tests
        run: |
          uv venv --python 3.13 /tmp/sdist-env
          uv pip install --python /tmp/sdist-env "$(ls dist/*.tar.gz)[gensim]" pytest
          /tmp/sdist-env/bin/python -m pytest tests -m "not network" -p no:cacheprovider
      - name: Use the sdist without gensim
        run: |
          uv venv --python 3.13 /tmp/plain-env
          uv pip install --python /tmp/plain-env dist/*.tar.gz
          cd /tmp && /tmp/plain-env/bin/python -c "
          import importlib.util, tempfile, pathlib, numpy as np
          assert importlib.util.find_spec('gensim') is None, 'gensim is installed'
          import fse
          wv = fse.WordVectors.from_arrays(np.ones((2, 3), np.float32), words=['a', 'b']).quantize('int8')
          path = pathlib.Path(tempfile.mkdtemp()) / 'wv.safetensors'
          wv.save(path)
          for mmap in (False, True):
              assert fse.WordVectors.load(path, mmap=mmap).fingerprint == wv.fingerprint
          try:
              fse.Average
          except ImportError as err:
              assert 'fse[gensim]' in str(err), err
          else:
              raise AssertionError('Average without gensim')
          print('fse without gensim works')
          "
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          retention-days: 7

  wheels:
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - uses: pypa/cibuildwheel@b9e566a2b284570af229f6c2a33673410d0389a3  # v4.3.4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          retention-days: 7

  check:
    if: always()
    needs: [lint, test, coverage, python-314, sdist, wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35  # v1.3.0
        with:
          allowed-failures: python-314
          jobs: ${{ toJSON(needs) }}

  release:
    needs: check
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download sdist and wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          skip-existing: true
