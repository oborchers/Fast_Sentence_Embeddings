name: CI

on:
  push:
    branches: [master]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    # Monthly run against the newest dependency versions, so breakage from
    # numpy, scipy or gensim releases shows up without active development.
    - cron: "0 6 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COLUMNS: 150
  # The scheduled run resolves the newest versions instead of the lockfile.
  UV_SYNC_FLAGS: ${{ github.event_name == 'schedule' && '--upgrade' || '--locked' }}

jobs:
  # What a pull request needs to run. A pull request that touches only docs/ and Markdown
  # files (README.md excepted, it is the package's description) skips every job below;
  # check still runs and passes. Otherwise lint always runs, and test runs on Linux with
  # Python 3.13 (the newest version where every test runs; gensim does not build on 3.14
  # and newer). The rest depends on the files changed, see the outputs below. Pushes to
  # master, tags, the monthly run and manual runs test everything. A change of the
  # workflows themselves turns every output on.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      # The native code and the build: wheels (test-mlx covers the macOS tests).
      native: ${{ steps.diff.outputs.native }}
      # The dependency pins: the job with the minimum versions.
      deps: ${{ steps.diff.outputs.deps }}
      # The sentence-transformers path: test-st.
      st: ${{ steps.diff.outputs.st }}
      # The mlx backend and what it shares with the native code: test-mlx.
      mlx: ${{ steps.diff.outputs.mlx }}
      # The packaging: the sdist job.
      sdist: ${{ steps.diff.outputs.sdist }}
      # The matrix of the test job.
      test_matrix: ${{ steps.diff.outputs.test_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          full=$(jq -nc '[{os: "ubuntu-latest", "python-version": ("3.11", "3.12", "3.13", "3.14", "3.15"), deps: "latest"}, {os: "macos-latest", "python-version": ("3.11", "3.12", "3.13", "3.14", "3.15"), deps: "latest"}, {os: "ubuntu-latest", "python-version": "3.11", deps: "min"}]')
          if [ "$EVENT" != "pull_request" ]; then
            {
              for name in code native deps st mlx sdist; do echo "$name=true"; done
              echo "test_matrix={\"include\":$full}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "origin/$BASE...HEAD")
          echo "$files"
          # Whether a changed file matches an extended regular expression.
          touches() { echo "$files" | grep -qE "$1"; }
          # Output NAME is true when a file matches the regular expression or a workflow changed.
          flag() {
            if touches "$2" || touches '^\.github/workflows/'; then echo "$1=true"; else echo "$1=false"; fi
          }
          other=$(echo "$files" | grep -vE '^docs/|\.md$' || true)  # files beyond the docs
          # pyproject.toml counts for the outputs below (not for code) only when one of its
          # build and dependency tables differs from the merge base: build-system, project,
          # dependency-groups, setuptools, setuptools_scm, cibuildwheel (how the wheels are
          # built and tested) and uv (the resolution), each with its subtables. A change of
          # the other tool settings (ruff, importlinter, pytest) is an ordinary code change. An absent table
          # equals an empty one; a pyproject.toml that is new or unreadable counts.
          if touches '^pyproject\.toml$'; then
            mb=$(git merge-base "origin/$BASE" HEAD)
            if git show "$mb:pyproject.toml" > "$RUNNER_TEMP/pyproject.base" 2>/dev/null \
              && python3 - "$RUNNER_TEMP/pyproject.base" pyproject.toml <<'PY'
          import sys, tomllib
          def tables(path):
              with open(path, "rb") as f:
                  d = tomllib.load(f)
              tool = d.get("tool", {})
              return [d.get("build-system", {}), d.get("project", {}), d.get("dependency-groups", {}),
                      tool.get("setuptools", {}), tool.get("setuptools_scm", {}),
                      tool.get("cibuildwheel", {}), tool.get("uv", {})]
          sys.exit(tables(sys.argv[1]) != tables(sys.argv[2]))
          PY
            then
              files=$(echo "$files" | grep -vxF pyproject.toml || true)
            fi
          fi
          if [ -n "$other" ] || touches '^README\.md$'; then code=true; else code=false; fi
          {
            echo "code=$code"
            # The extension sources, setup.py, the project metadata, the sdist manifest,
            # the lockfile.
            flag native '^src/fse/_native|^(setup\.py|pyproject\.toml|MANIFEST\.in|uv\.lock)$|\.(pyx|pxd|pxi|h)$'
            flag deps '^(pyproject\.toml|uv\.lock)$'
            # The converter, its tests and helpers (tests/support/converted.py builds the
            # models of the conversion tests), and the pins of the st group.
            flag st '^src/fse/_encoder/_sentence_transformers|^tests/test_encoder_sentence_transformers|^tests/support/(sentence_transformers|converted)\.py$|^(pyproject\.toml|uv\.lock)$'
            # The backend and its tests, the backend registry, the device conformance
            # tests with their helpers, and everything native (the kernels it mirrors).
            flag mlx '^src/fse/_backends/(_mlx/|__init__\.py$)|^tests/test_backends_mlx|^tests/test_conformance_device|^tests/support/(fake_mlx|conformance)\.py$|^src/fse/_native|^(setup\.py|pyproject\.toml|MANIFEST\.in|uv\.lock)$|\.(pyx|pxd|pxi|h)$'
            flag sdist '^(setup\.py|pyproject\.toml|MANIFEST\.in|uv\.lock)$|^src/fse/[^/]*\.(pyx|pxd|pxi|h)$'
          } >> "$GITHUB_OUTPUT"
          # Linux on 3.13, plus the minimum versions when the pins change. No macOS entry:
          # test-mlx runs the whole suite (pytest tests -m "not network", Python 3.13, group
          # test plus mlx) on macOS, and the mlx output is true wherever native is (its
          # pattern contains all of native's), so a macOS entry here would repeat it. The
          # entry stays only for a case where native is true and mlx is not.
          matrix=$(jq -nc --argjson native "$(grep -qx 'native=true' "$GITHUB_OUTPUT" && echo true || echo false)" --argjson mlx "$(grep -qx 'mlx=true' "$GITHUB_OUTPUT" && echo true || echo false)" --argjson deps "$(grep -qx 'deps=true' "$GITHUB_OUTPUT" && echo true || echo false)" '[{os: "ubuntu-latest", "python-version": "3.13", deps: "latest"}] + (if ($native and ($mlx | not)) then [{os: "macos-latest", "python-version": "3.13", deps: "latest"}] else [] end) + (if $deps then [{os: "ubuntu-latest", "python-version": "3.11", deps: "min"}] else [] end)')
          echo "test_matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
      - run: uv sync $UV_SYNC_FLAGS --group lint
      - run: make format-check
      - run: make lint
      - name: The ratchet of the guardrails does not grow against the base branch
        if: github.event_name == 'pull_request'
        run: uv run python tools/check_guardrails.py --base "origin/${{ github.base_ref }}"
      - name: Tests of the guardrail checker with its tools installed
        run: uv run --group test pytest tests/test_check_guardrails.py -p no:cacheprovider
      - run: make typecheck

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.test_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - run: uv sync $UV_SYNC_FLAGS --group test --python ${{ matrix.python-version }}
      - name: Pin minimum dependencies
        if: matrix.deps == 'min'
        run: >-
          uv pip install
          "numpy==1.26.4" "pydantic==2.5.0" "xxhash==3.2.0" "gensim==4.3.3" "safetensors==0.4.0"
          "scikit-learn==1.5.0" "huggingface-hub==1.0.0"
      # A pull request skips the coverage (the merged report runs on master and tags only)
      # and so runs faster.
      - name: Run tests${{ github.event_name != 'pull_request' && ' with coverage' || '' }}
        if: matrix.deps != 'min'
        run: make ${{ github.event_name == 'pull_request' && 'test' || 'test-cov' }}
        env:
          COVERAGE_FILE: .coverage.${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.deps }}
      - name: Run tests${{ github.event_name != 'pull_request' && ' with coverage' || '' }} on minimum dependencies
        if: matrix.deps == 'min'
        run: make ${{ github.event_name == 'pull_request' && 'test' || 'test-cov' }}
        env:
          # Keep the pinned minimum versions instead of re-syncing the lockfile.
          UV_NO_SYNC: "1"
          COVERAGE_FILE: .coverage.${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.deps }}
      - name: Upload coverage
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.deps }}
          path: .coverage.*
          include-hidden-files: true
          retention-days: 7

  # The comparisons with sentence-transformers 6.2.0 (group st, torch from the CPU index
  # of PyTorch). A job of its own: sentence-transformers needs huggingface-hub 1.3 or
  # newer, so it cannot share the minimum job, and torch would slow every other job.
  # FSE_REQUIRE_ST makes a missing package fail the tests instead of skipping them.
  test-st:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.st == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.15" }
          - { os: macos-latest, python-version: "3.13" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - run: uv sync $UV_SYNC_FLAGS --group test --group st --python ${{ matrix.python-version }}
      - run: uv run python -c "import sentence_transformers, torch; print(sentence_transformers.__version__, torch.__version__)"
      - run: make test-st
        env:
          UV_NO_SYNC: "1"

  # The mlx backend on Apple silicon. The probe prints whether this runner has Metal (a
  # GitHub macOS runner is a virtual machine; GitHub documents GPU access only for its
  # larger paid runners) and the canary's result. Where Metal works the tests must run
  # the backend (FSE_REQUIRE_MLX), otherwise its tests skip with the reason and the
  # maintainer's `make test-mlx` on an Apple silicon Mac is the gate. The lockfile pins
  # mlx at its lower bound, 0.32.4, so this job also tests the minimum version.
  test-mlx:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.mlx == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync $UV_SYNC_FLAGS --group test --group mlx --python 3.13
      - name: Probe Metal and the canary
        id: probe
        run: |
          uv run python - <<'PY'
          import os
          import mlx.core as mx
          metal = mx.metal.is_available()
          print("mlx", mx.__version__, "Metal available:", metal)
          if metal:
              print(mx.device_info())
              from fse._backends import get_backend
              backend = get_backend("mlx")
              backend.device.ready()  # the canary, which every prepare runs once per process
              print("canary: passed")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"metal={'true' if metal else 'false'}\n")
          PY
      # A pull request skips the coverage, as in the test job.
      - name: Run tests${{ github.event_name != 'pull_request' && ' with coverage' || '' }}, the mlx backend required where Metal works
        run: make ${{ github.event_name == 'pull_request' && 'test' || 'test-cov' }}
        env:
          FSE_REQUIRE_MLX: ${{ steps.probe.outputs.metal == 'true' && '1' || '' }}
          COVERAGE_FILE: .coverage.macos-mlx
      - name: Upload coverage
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-macos-mlx
          path: .coverage.*
          include-hidden-files: true
          retention-days: 7

  # The merged coverage of the test jobs: a pull request runs only some of them.
  coverage:
    needs: [changes, test, test-mlx]
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - run: uv sync --locked --group test
      - name: Download coverage artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine coverage
        run: |
          uv run coverage combine
          uv run coverage report

  sdist:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.sdist == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
      - run: uv build --sdist
      - run: uv run --no-project --with twine twine check dist/*
      - name: Install the sdist into a clean environment and run the tests
        # tokenizers, model2vec and safetensors as in the test group of pyproject.toml: the
        # conformance tests of wordpiece@1 and Model2Vec skip without them, so the check
        # below makes sure they run.
        run: |
          uv venv --python 3.13 /tmp/sdist-env
          uv pip install --python /tmp/sdist-env "$(ls dist/*.tar.gz)[gensim]" pytest "tokenizers==0.23.3" "model2vec==0.10.0" "safetensors>=0.4.0"
          /tmp/sdist-env/bin/python -c "import huggingface_hub, tokenizers, model2vec, safetensors; assert tokenizers.__version__ == '0.23.3', tokenizers.__version__"
          /tmp/sdist-env/bin/python -m pytest tests -m "not network" -p no:cacheprovider
      - name: Use the sdist without gensim
        run: |
          uv venv --python 3.13 /tmp/plain-env
          uv pip install --python /tmp/plain-env dist/*.tar.gz
          cd /tmp && /tmp/plain-env/bin/python -c "
          import importlib.util, tempfile, pathlib, numpy as np
          for name in ('gensim', 'scipy'):
              assert importlib.util.find_spec(name) is None, name + ' is installed'
          assert importlib.util.find_spec('xxhash') is not None, 'xxhash is not installed'
          assert importlib.util.find_spec('huggingface_hub') is not None, 'huggingface-hub is not installed'
          import sys
          import fse
          assert 'huggingface_hub' not in sys.modules, 'import fse loaded huggingface_hub'
          from fse import _native, _reference
          from fse._contract import Batch
          wv = fse.WordVectors.from_arrays(np.ones((2, 3), np.float32), words=['a', 'b']).quantize('int8')
          path = pathlib.Path(tempfile.mkdtemp()) / 'wv.safetensors'
          wv.save(path)
          assert wv.fingerprint.startswith('xxh3-128:'), wv.fingerprint
          for mmap in (False, True):
              assert fse.WordVectors.load(path, mmap=mmap).fingerprint == wv.fingerprint
          batch = Batch(0, np.array([0, 2], np.int64), np.array([0, 1], np.uint32))
          args = (wv.stored_vectors, np.ones(2, np.float32), wv.scales)
          got, want = _native.pool_weighted_mean(batch, *args), _reference.pool_weighted_mean(batch, *args)
          assert got.view(np.uint32).tolist() == want.view(np.uint32).tolist()
          encoder = fse.Encoder.from_word_vectors(wv)
          rows = encoder.encode(['a b', 'b'])
          assert rows.shape == (2, 3), rows.shape
          encoder.save(path.with_name('encoder.safetensors'))
          loaded = fse.Encoder.load(path.with_name('encoder.safetensors'), mmap=True)
          assert loaded.encode(['a b', 'b']).tobytes() == rows.tobytes()
          try:
              fse.uSIF
          except AttributeError as err:
              assert 'fse==1.1.0' in str(err), err
          else:
              raise AssertionError('the 1.x uSIF exists')
          assert 'huggingface_hub' not in sys.modules, 'a local model loaded huggingface_hub'
          print('fse without gensim and scipy works')
          "
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          retention-days: 7

  wheels:
    name: wheels (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.native == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
        # A pull request skips the macOS Intel wheels: Linux tests the x86 code, Apple
        # silicon the macOS code, and the Intel runners are the slowest and scarcest.
        # master and tags build and test them before every release.
        exclude: ${{ github.event_name == 'pull_request' && fromJSON('[{"os":"macos-15-intel"}]') || fromJSON('[]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - uses: pypa/cibuildwheel@b9e566a2b284570af229f6c2a33673410d0389a3  # v4.3.4
        env:
          # A pull request builds every wheel but tests only those of the newest Python; the
          # test jobs cover 3.11 (the minimum job) to 3.13. master and tags test all.
          CIBW_TEST_SKIP: ${{ github.event_name == 'pull_request' && 'cp311-* cp312-* cp313-* cp314-*' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          retention-days: 7

  check:
    if: always()
    needs: [changes, lint, test, test-st, test-mlx, coverage, sdist, wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35  # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          # A pull request skips jobs on purpose (documentation only, no native code
          # changed, and so on); a skipped job counts as passed, a failed one fails.
          allowed-skips: lint, test, test-st, test-mlx, coverage, sdist, wheels

  release:
    needs: check
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download sdist and wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          skip-existing: true
