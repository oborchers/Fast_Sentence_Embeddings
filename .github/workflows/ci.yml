name: CI

on:
  push:
    branches: [master]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      scope:
        description: Full verification or optional macOS evidence for one current PR head
        type: choice
        options: [full, pr-macos]
        default: full
      pr_number:
        description: Required for pr-macos, open PR against master
        type: string
      head_sha:
        description: Required for pr-macos, full current PR head SHA
        type: string
  schedule:
    # Monthly run against the newest dependency versions, so breakage from
    # numpy, scipy or gensim releases shows up without active development.
    - cron: "0 6 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.scope == 'pr-macos' && format('pr-macos-{0}-{1}', inputs.pr_number, inputs.head_sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COLUMNS: 150
  # The scheduled run resolves the newest versions instead of the lockfile.
  UV_SYNC_FLAGS: ${{ github.event_name == 'schedule' && '--upgrade' || '--locked' }}

jobs:
  # What a pull request needs to run. A pull request that touches only docs/ and Markdown
  # files (README.md excepted, it is the package's description) skips every job below;
  # check still runs and passes. Otherwise lint always runs, and test runs on Linux with
  # Python 3.13 (the newest version where every test runs; gensim does not build on 3.14
  # and newer). The rest depends on the files changed, see the outputs below. Pushes to
  # master use all macOS test interpreters; release tags use one.
  # PR macOS jobs are explicit opt-ins. Monthly and full manual runs use the full matrix.
  # Skill-only instructions and metadata also skip heavy jobs on ordinary master
  # pushes. Unknown bases and workflow changes keep the full non-macOS PR selection.
  # A change of the workflows themselves turns every output on.
  changes:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      # The native code and the build: wheels.
      native: ${{ steps.diff.outputs.native }}
      # The dependency pins: the job with the minimum versions.
      deps: ${{ steps.diff.outputs.deps }}
      # The sentence-transformers path: test-st.
      st: ${{ steps.diff.outputs.st }}
      # The packaging: the sdist job.
      sdist: ${{ steps.diff.outputs.sdist }}
      # The matrix of the test job.
      test_matrix: ${{ steps.diff.outputs.test_matrix }}
      st_matrix: ${{ steps.diff.outputs.st_matrix }}
      wheel_matrix: ${{ steps.diff.outputs.wheel_matrix }}
      source_repository: ${{ steps.source.outputs.source_repository }}
      source_ref: ${{ steps.source.outputs.source_ref }}
      target_pr: ${{ steps.source.outputs.target_pr }}
      targeted: ${{ steps.source.outputs.targeted }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: source
        name: Resolve and pin the requested source
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SCOPE: ${{ inputs.scope }}
          CI_PR_NUMBER: ${{ inputs.pr_number }}
          CI_HEAD_SHA: ${{ inputs.head_sha }}
        run: python3 tools/ci_target.py
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          TARGETED: ${{ steps.source.outputs.targeted }}
        run: |
          full=$(jq -nc '[{os: "ubuntu-latest", "python-version": ("3.11", "3.12", "3.13", "3.14", "3.15"), deps: "latest"}, {os: "macos-latest", "python-version": ("3.11", "3.12", "3.13", "3.14", "3.15"), deps: "latest"}, {os: "ubuntu-latest", "python-version": "3.11", deps: "min"}]')
          # Automatic PRs never allocate a macOS runner, even on unknown bases or workflow changes.
          if [ "$EVENT" = "pull_request" ]; then
            full=$(echo "$full" | jq -c '[.[] | select(.os != "macos-latest")]')
          fi
          wheel_os='["ubuntu-latest","ubuntu-24.04-arm","macos-latest","windows-latest"]'
          if [ "$EVENT" = "pull_request" ]; then
            wheel_os='["ubuntu-latest","ubuntu-24.04-arm","windows-latest"]'
          fi
          extended=false
          if [[ "$REF" == refs/tags/v* ]] || [ "$EVENT" = "workflow_dispatch" ]; then extended=true; fi
          wheels=$(jq -nc --argjson platforms "$wheel_os" --argjson extended "$extended" \
            '[ $platforms[] as $os | ("manylinux", "musllinux") as $libc |
               select($libc == "manylinux" or ($extended and ($os | startswith("ubuntu-")))) |
               {os: $os, libc: $libc} ]')
          echo "wheel_matrix={\"include\":$wheels}" >> "$GITHUB_OUTPUT"
          if [ "$TARGETED" = "true" ]; then
            {
              echo 'code=true'
              echo 'native=true'
              echo 'deps=false'
              echo 'st=true'
              echo 'sdist=false'
              echo 'test_matrix={"include":[{"os":"macos-latest","python-version":"3.13","deps":"latest"}]}'
              echo 'st_matrix={"include":[{"os":"macos-latest","python-version":"3.13"}]}'
              echo 'wheel_matrix={"include":[{"os":"macos-latest","libc":"manylinux"}]}'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Release tags need only one macOS test runner.
          # 3.13 is the newest Python where the optional gensim tests also run.
          if [ "$EVENT" = "push" ] && [[ "$REF" == refs/tags/v* ]]; then
            full=$(echo "$full" | jq -c '[.[] | select(.os != "macos-latest" or .["python-version"] == "3.13")]')
          fi
          st=$(jq -nc --arg event "$EVENT" --arg ref "$REF" '[{os: "ubuntu-latest", "python-version": ("3.11", "3.15")}] + (if $event == "pull_request" or ($event == "push" and ($ref | startswith("refs/tags/v"))) then [] else [{os: "macos-latest", "python-version": "3.13"}] end)')
          echo "st_matrix={\"include\":$st}" >> "$GITHUB_OUTPUT"
          # Only a verified PR base or ordinary master push can use the light path.
          # A missing, initial, or otherwise unknown base falls back to all jobs.
          comparison=""
          if [ "$EVENT" = "pull_request" ]; then
            comparison=$(git merge-base "origin/$BASE" HEAD || true)
          elif [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/master" ] \
            && [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
            && git merge-base --is-ancestor "$BEFORE" HEAD; then
            comparison="$BEFORE"
          fi
          if [ -n "$comparison" ] && python3 - "$comparison" <<'PY'
          import re, subprocess, sys
          # Keep the allowlist narrow. Scripts, assets, unknown metadata, and executable
          # or symlink modes must run normal CI, even inside a skill directory.
          skill = re.compile(r"\.agents/skills/[a-z0-9-]+/(SKILL\.md|agents/openai\.yaml|references/(?:[a-zA-Z0-9_-]+/)*[a-zA-Z0-9_.-]+\.md)")
          raw = subprocess.check_output([
              "git", "diff", "--raw", "--no-abbrev", "--no-renames", "-z", sys.argv[1], "HEAD",
          ]).split(b"\0")
          found = False
          for index in range(0, len(raw) - 1, 2):
              header, path = raw[index:index + 2]
              modes = header.split()[:2]
              if any(mode.lstrip(b":") not in (b"000000", b"100644") for mode in modes):
                  sys.exit(1)
              name = path.decode("utf-8", errors="strict")
              if skill.fullmatch(name):
                  found = True
              elif name != "CHANGELOG.md":
                  sys.exit(1)
          sys.exit(0 if found else 1)
          PY
          then
            {
              for name in code native deps st sdist; do echo "$name=false"; done
              echo "test_matrix={\"include\":$full}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "pull_request" ] && [ -z "$comparison" ]; then
            {
              for name in code native deps st sdist; do echo "$name=true"; done
              echo "test_matrix={\"include\":$full}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" != "pull_request" ]; then
            {
              for name in code native deps st sdist; do echo "$name=true"; done
              echo "test_matrix={\"include\":$full}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "origin/$BASE...HEAD")
          echo "$files"
          # Whether a changed file matches an extended regular expression.
          touches() { echo "$files" | grep -qE "$1"; }
          # Output NAME is true when a file matches the regular expression or a workflow changed.
          flag() {
            if touches "$2" || touches '^\.github/workflows/'; then echo "$1=true"; else echo "$1=false"; fi
          }
          other=$(echo "$files" | grep -vE '^docs/|\.md$' || true)  # files beyond the docs
          # pyproject.toml counts for the outputs below (not for code) only when one of its
          # build and dependency tables differs from the merge base: build-system, project,
          # dependency-groups, setuptools, setuptools_scm, cibuildwheel (how the wheels are
          # built and tested) and uv (the resolution), each with its subtables. A change of
          # the other tool settings (ruff, importlinter, pytest) is an ordinary code change. An absent table
          # equals an empty one; a pyproject.toml that is new or unreadable counts.
          if touches '^pyproject\.toml$'; then
            mb=$(git merge-base "origin/$BASE" HEAD)
            if git show "$mb:pyproject.toml" > "$RUNNER_TEMP/pyproject.base" 2>/dev/null \
              && python3 - "$RUNNER_TEMP/pyproject.base" pyproject.toml <<'PY'
          import sys, tomllib
          def tables(path):
              with open(path, "rb") as f:
                  d = tomllib.load(f)
              tool = d.get("tool", {})
              return [d.get("build-system", {}), d.get("project", {}), d.get("dependency-groups", {}),
                      tool.get("setuptools", {}), tool.get("setuptools_scm", {}),
                      tool.get("cibuildwheel", {}), tool.get("uv", {})]
          sys.exit(tables(sys.argv[1]) != tables(sys.argv[2]))
          PY
            then
              files=$(echo "$files" | grep -vxF pyproject.toml || true)
            fi
          fi
          if [ -n "$other" ] || touches '^README\.md$|^\.agents/skills/'; then code=true; else code=false; fi
          {
            echo "code=$code"
            # The extension sources, setup.py, the project metadata, the sdist manifest,
            # the lockfile. Store/container changes also need the real Windows suite.
            flag native '^tools/hub/|^benchmarks/[^/]*hub[^/]*\.py$|^benchmarks/baseline/dr157/|^tests/test_hub|^tests/support/hub_classics\.py$|^\.gitattributes$|^src/fse/_native|^src/fse/(_store|_container)/|^tests/test_(store|container)|^tests/support/(durability|store)\.py$|^(setup\.py|pyproject\.toml|MANIFEST\.in|uv\.lock)$|\.(pyx|pxd|pxi|h)$'
            flag deps '^(pyproject\.toml|uv\.lock)$'
            # The converter, its tests and helpers (tests/support/converted.py builds the
            # models of the conversion tests), and the pins of the st group.
            flag st '^src/fse/_encoder/_sentence_transformers|^tests/test_encoder_sentence_transformers|^tests/support/(sentence_transformers|converted)\.py$|^(pyproject\.toml|uv\.lock)$'
            flag sdist '^(setup\.py|pyproject\.toml|MANIFEST\.in|uv\.lock)$|^src/fse/(_native_src/.*|[^/]*)\.(pyx|pxd|pxi|h)$'
          } >> "$GITHUB_OUTPUT"
          # Linux on 3.13 and selected minimum dependencies. macOS is explicit only.
          matrix=$(jq -nc --argjson deps "$(grep -qx 'deps=true' "$GITHUB_OUTPUT" && echo true || echo false)" '[{os: "ubuntu-latest", "python-version": "3.13", deps: "latest"}] + (if $deps then [{os: "ubuntu-latest", "python-version": "3.11", deps: "min"}] else [] end)')
          echo "test_matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.targeted != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - run: uv sync "$UV_SYNC_FLAGS" --group lint
      - run: make format-check
      - run: make lint
      - name: The ratchet of the guardrails does not grow against the base branch
        if: github.event_name == 'pull_request'
        run: uv run python tools/check_guardrails.py --base "origin/${{ github.base_ref }}"
      - name: Tests of the guardrail checker with its tools installed
        run: uv run --group test pytest tests/test_check_guardrails.py -p no:cacheprovider
      - run: make typecheck

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }}, ${{ matrix.deps }})${{ needs.changes.outputs.targeted == 'true' && format(' at {0}', needs.changes.outputs.source_ref) || '' }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.test_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ needs.changes.outputs.source_repository }}
          ref: ${{ needs.changes.outputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the executing checkout SHA
        env:
          EXPECTED_SHA: ${{ needs.changes.outputs.source_ref }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: ${{ needs.changes.outputs.targeted != 'true' }}
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - run: uv sync "$UV_SYNC_FLAGS" --group test --python ${{ matrix.python-version }}
      - name: Pin minimum dependencies
        if: matrix.deps == 'min'
        # Arrow 25.0.1 supports NumPy >=1.21.2 and datasets' pyarrow>=24 requirement.
        # Keep real Arrow/Parquet producers active with NumPy 1.26.4; Arrow 26 needs 2.x.
        run: >-
          uv pip install
          "numpy==1.26.4" "pydantic==2.5.0" "xxhash==3.2.0" "gensim==4.3.3" "safetensors==0.4.0"
          "scikit-learn==1.5.0" "huggingface-hub==1.0.0" "pytest-xdist==3.6.1" "pyarrow==25.0.1"
      - name: Verify Arrow ID and Parquet tests on minimum dependencies
        if: matrix.deps == 'min'
        run: >-
          uv run pytest -vv -rA
          tests/test_text_ids.py::test_arrow_chunk_offsets_and_nulls
          tests/test_encoder_doc_ids.py::test_parquet_recipe
        env:
          UV_NO_SYNC: "1"
      # A pull request skips the coverage (the merged report runs on master and tags only)
      # and so runs faster.
      - name: Run tests${{ (github.event_name != 'pull_request' && needs.changes.outputs.targeted != 'true') && ' with coverage' || '' }}
        if: matrix.deps != 'min'
        run: make ${{ (github.event_name == 'pull_request' || needs.changes.outputs.targeted == 'true') && 'test' || 'test-cov' }}
        env:
          COVERAGE_FILE: .coverage.${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.deps }}
      - name: Run tests${{ (github.event_name != 'pull_request' && needs.changes.outputs.targeted != 'true') && ' with coverage' || '' }} on minimum dependencies
        if: matrix.deps == 'min'
        run: make ${{ (github.event_name == 'pull_request' || needs.changes.outputs.targeted == 'true') && 'test' || 'test-cov' }}
        env:
          # Keep the pinned minimum versions instead of re-syncing the lockfile.
          UV_NO_SYNC: "1"
          COVERAGE_FILE: .coverage.${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.deps }}
      - name: Upload coverage
        if: (github.event_name != 'pull_request' && needs.changes.outputs.targeted != 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.deps }}
          path: .coverage.*
          include-hidden-files: true
          retention-days: 7

  # The comparisons with sentence-transformers 6.2.0 (group st, torch from the CPU index
  # of PyTorch). A job of its own: sentence-transformers needs huggingface-hub 1.3 or
  # newer, so it cannot share the minimum job, and torch would slow every other job.
  # FSE_REQUIRE_ST makes a missing package fail the tests instead of skipping them.
  test-st:
    name: test-st (${{ matrix.os }}, ${{ matrix.python-version }})${{ needs.changes.outputs.targeted == 'true' && format(' at {0}', needs.changes.outputs.source_ref) || '' }}
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.st == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # macOS comparisons run on master, scheduled and manual runs, not PRs or tags.
      matrix: ${{ fromJSON(needs.changes.outputs.st_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ needs.changes.outputs.source_repository }}
          ref: ${{ needs.changes.outputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the executing checkout SHA
        env:
          EXPECTED_SHA: ${{ needs.changes.outputs.source_ref }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: ${{ needs.changes.outputs.targeted != 'true' }}
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - run: uv sync "$UV_SYNC_FLAGS" --group test --group st --python ${{ matrix.python-version }}
      - run: uv run python -c "import sentence_transformers, torch; print(sentence_transformers.__version__, torch.__version__)"
      - run: make test-st
        env:
          UV_NO_SYNC: "1"

  # The merged coverage of the test jobs: a pull request runs only some of them.
  coverage:
    needs: [changes, test]
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request' && needs.changes.outputs.targeted != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --locked --group test
      - name: Download coverage artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine coverage
        run: |
          uv run coverage combine
          uv run coverage report

  sdist:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.sdist == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - run: uv build --sdist
      - run: uv run --no-project --with twine twine check dist/*
      - name: Install the sdist into a clean environment and run the tests
        # tokenizers, model2vec and safetensors as in the test group of pyproject.toml: the
        # conformance tests of wordpiece@1 and Model2Vec skip without them, so the check
        # below makes sure they run.
        run: |
          uv venv --python 3.13 /tmp/sdist-env
          uv pip install --python /tmp/sdist-env "$(ls dist/*.tar.gz)[gensim]" pytest "tokenizers==0.23.3" "model2vec==0.10.0" "safetensors>=0.4.0"
          /tmp/sdist-env/bin/python -c "import huggingface_hub, tokenizers, model2vec, safetensors; assert tokenizers.__version__ == '0.23.3', tokenizers.__version__"
          /tmp/sdist-env/bin/python -m pytest tests -m "not network" -p no:cacheprovider
      - name: Use the sdist without gensim
        run: |
          uv venv --python 3.13 /tmp/plain-env
          uv pip install --python /tmp/plain-env dist/*.tar.gz
          cd /tmp && /tmp/plain-env/bin/python -c "
          import importlib.util, tempfile, pathlib, numpy as np
          for name in ('gensim', 'scipy'):
              assert importlib.util.find_spec(name) is None, name + ' is installed'
          assert importlib.util.find_spec('xxhash') is not None, 'xxhash is not installed'
          assert importlib.util.find_spec('huggingface_hub') is not None, 'huggingface-hub is not installed'
          import sys
          import fse
          assert 'huggingface_hub' not in sys.modules, 'import fse loaded huggingface_hub'
          from fse import _native, _reference
          from fse._contract import Batch
          wv = fse.WordVectors.from_arrays(np.ones((2, 3), np.float32), words=['a', 'b']).quantize('int8')
          path = pathlib.Path(tempfile.mkdtemp()) / 'wv.safetensors'
          wv.save(path)
          assert wv.fingerprint.startswith('xxh3-128:'), wv.fingerprint
          for mmap in (False, True):
              assert fse.WordVectors.load(path, mmap=mmap).fingerprint == wv.fingerprint
          batch = Batch(0, np.array([0, 2], np.int64), np.array([0, 1], np.uint32))
          args = (wv.stored_vectors, np.ones(2, np.float32), wv.scales)
          got, want = _native.pool_weighted_mean(batch, *args), _reference.pool_weighted_mean(batch, *args)
          assert got.view(np.uint32).tolist() == want.view(np.uint32).tolist()
          encoder = fse.Encoder.from_word_vectors(wv)
          rows = encoder.encode(['a b', 'b'])
          assert rows.shape == (2, 3), rows.shape
          encoder.save(path.with_name('encoder.safetensors'))
          loaded = fse.Encoder.load(path.with_name('encoder.safetensors'), mmap=True)
          assert loaded.encode(['a b', 'b']).tobytes() == rows.tobytes()
          try:
              fse.uSIF
          except AttributeError as err:
              assert 'fse==1.1.0' in str(err), err
          else:
              raise AssertionError('the 1.x uSIF exists')
          assert 'huggingface_hub' not in sys.modules, 'a local model loaded huggingface_hub'
          print('fse without gensim and scipy works')
          "
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          retention-days: 7

  wheels:
    name: wheels (${{ matrix.os }}, ${{ matrix.libc }})${{ needs.changes.outputs.targeted == 'true' && format(' at {0}', needs.changes.outputs.source_ref) || '' }}
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.native == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.wheel_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ needs.changes.outputs.source_repository }}
          ref: ${{ needs.changes.outputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the executing checkout SHA
        env:
          EXPECTED_SHA: ${{ needs.changes.outputs.source_ref }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e  # v4.3.5
        env:
          # A pull request builds every wheel but tests only those of the newest Python; the
          # test jobs cover 3.11 (the minimum job) to 3.13. Windows also tests 3.11
          # on PRs, so its filesystem semantics are checked at both supported ends.
          # Other events test all.
          CIBW_SKIP: "*-win32 *_i686 *-${{ matrix.libc == 'musllinux' && 'manylinux' || 'musllinux' }}_*"
          CIBW_TEST_SKIP: ${{ github.event_name == 'pull_request' && (matrix.os == 'windows-latest' && 'cp312-* cp313-* cp314-*' || 'cp311-* cp312-* cp313-* cp314-*') || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-wheels-${{ matrix.os }}-${{ matrix.libc }}${{ needs.changes.outputs.targeted == 'true' && format('-pr-{0}-{1}', needs.changes.outputs.target_pr, needs.changes.outputs.source_ref) || '' }}
          path: wheelhouse/*.whl
          retention-days: 7

  check:
    if: always()
    needs: [changes, lint, test, test-st, coverage, sdist, wheels]
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      # Controller code, not code from the optionally tested PR/fork.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Revalidate the optional PR head before accepting evidence
        if: needs.changes.outputs.targeted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SCOPE: pr-macos
          CI_PR_NUMBER: ${{ needs.changes.outputs.target_pr }}
          CI_HEAD_SHA: ${{ needs.changes.outputs.source_ref }}
        run: python3 tools/ci_target.py
      - name: Require every selected job and every started matrix entry to succeed
        env:
          GH_TOKEN: ${{ github.token }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci_check.py

  release:
    needs: check
    if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Require successful full master CI for this release commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          gh api --method GET "repos/$GH_REPO/actions/workflows/ci.yml/runs" \
            -f branch=master -f event=push -f head_sha="$RELEASE_SHA" -f per_page=100 \
            --paginate --slurp > "$RUNNER_TEMP/master-ci.json"
          # Select the newest run, including its current rerun attempt. An older
          # success must not hide a newer failed, cancelled or unfinished run.
          run=$(jq -c --arg sha "$RELEASE_SHA" '[.[].workflow_runs[] |
            select(.head_sha == $sha and .head_branch == "master" and .event == "push")] |
            max_by(.id)' "$RUNNER_TEMP/master-ci.json")
          if ! jq -e '.status == "completed" and .conclusion == "success"' <<< "$run" > /dev/null; then
            echo "::error::Release requires successful full master CI for commit $RELEASE_SHA. Latest matching run: $run"
            exit 1
          fi
          gh api "repos/$GH_REPO/actions/runs/$(jq -r '.id' <<< "$run")/jobs?filter=latest&per_page=100" \
            --paginate --slurp > "$RUNNER_TEMP/master-jobs.json"
          if ! jq -e '[.[].jobs[]] | any(.name == "wheels (ubuntu-latest, manylinux)" and .conclusion == "success")' \
            "$RUNNER_TEMP/master-jobs.json" > /dev/null; then
            echo "::error::Release requires full master CI, not a skill-only run."
            exit 1
          fi
          echo "Verified full master CI: $(jq -r '.html_url' <<< "$run")"
      - name: Download sdist and wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          skip-existing: true
