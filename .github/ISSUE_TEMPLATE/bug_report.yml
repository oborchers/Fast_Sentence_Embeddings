name: Bug Report
description: Report something that isn't working correctly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        fse is in maintenance mode. Bugs and compatibility problems with current
        Python, numpy, scipy or gensim versions are in scope.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including the full traceback.
      placeholder: Describe the bug...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Minimal code to reproduce the issue.
      render: python
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.12"
    validations:
      required: true
  - type: input
    id: fse-version
    attributes:
      label: fse version
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: gensim-version
    attributes:
      label: gensim and numpy versions
      placeholder: "gensim 4.4.0, numpy 2.3.0"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: "macOS 15, arm64"
    validations:
      required: true
