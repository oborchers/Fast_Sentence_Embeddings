<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc">
<title id="title">fse performance on longer texts</title>
<desc id="desc">Absolute texts per second for float32, float16 and int8 model tables, with one and sixteen workers. All six bars use the same linear scale.</desc>
<rect width="1100" height="540" rx="12" fill="#0F0D0A"/>
<g font-family="Geist, Arial, sans-serif">
<text x="40" y="48" font-size="30" fill="#E8E4DF" font-weight="700" text-anchor="start">Performance on longer texts</text>
<text x="40" y="80" font-size="18" fill="#B0A9A0" font-weight="400" text-anchor="start">fse only. POTION-8M, 256 dimensions. Float32 output.</text>
<rect x="210" y="102" width="18" height="18" rx="3" fill="#B0A9A0"/>
<text x="238" y="118" font-size="18" fill="#E8E4DF" font-weight="400" text-anchor="start">1 worker</text>
<rect x="420" y="102" width="18" height="18" rx="3" fill="#5B9E7D"/>
<text x="448" y="118" font-size="18" fill="#E8E4DF" font-weight="400" text-anchor="start">16 workers</text>
<text x="40" y="193" font-size="23" fill="#E8E4DF" font-weight="700" text-anchor="start">float32</text>
<rect x="210" y="150" width="64.108" height="24" rx="3" fill="#B0A9A0"/>
<text x="286.10789188713653" y="169" font-size="20" fill="#E8E4DF" font-weight="700" text-anchor="start">183,165</text>
<rect x="210" y="186" width="635.444" height="24" rx="3" fill="#5B9E7D"/>
<text x="857.4438083441113" y="205" font-size="20" fill="#E8E4DF" font-weight="700" text-anchor="start">1,815,554</text>
<text x="40" y="303" font-size="23" fill="#E8E4DF" font-weight="700" text-anchor="start">float16</text>
<rect x="210" y="260" width="71.205" height="24" rx="3" fill="#B0A9A0"/>
<text x="293.20490799668244" y="279" font-size="20" fill="#E8E4DF" font-weight="700" text-anchor="start">203,443</text>
<rect x="210" y="296" width="679.569" height="24" rx="3" fill="#5B9E7D"/>
<text x="901.5688046619589" y="315" font-size="20" fill="#E8E4DF" font-weight="700" text-anchor="start">1,941,625</text>
<text x="40" y="413" font-size="23" fill="#E8E4DF" font-weight="700" text-anchor="start">int8</text>
<rect x="210" y="370" width="73.362" height="24" rx="3" fill="#B0A9A0"/>
<text x="295.3616791729185" y="389" font-size="20" fill="#E8E4DF" font-weight="700" text-anchor="start">209,605</text>
<rect x="210" y="406" width="690.795" height="24" rx="3" fill="#5B9E7D"/>
<text x="912.7949797749776" y="425" font-size="20" fill="#E8E4DF" font-weight="700" text-anchor="start">1,973,700</text>
<path d="M210 465 H910" stroke="#2A2520"/>
<text x="210.0" y="488" font-size="16" fill="#B0A9A0" font-weight="400" text-anchor="middle">0</text>
<text x="385.0" y="488" font-size="16" fill="#B0A9A0" font-weight="400" text-anchor="middle">500,000</text>
<text x="560.0" y="488" font-size="16" fill="#B0A9A0" font-weight="400" text-anchor="middle">1,000,000</text>
<text x="735.0" y="488" font-size="16" fill="#B0A9A0" font-weight="400" text-anchor="middle">1,500,000</text>
<text x="910.0" y="488" font-size="16" fill="#B0A9A0" font-weight="400" text-anchor="middle">2,000,000</text>
<text x="40" y="526" font-size="17" fill="#B0A9A0" font-weight="400" text-anchor="start">Texts per second. All bars use the same linear scale, starting at zero.</text>
