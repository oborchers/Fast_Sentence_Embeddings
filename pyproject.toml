[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "Cython>=3.0.11", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fse"
dynamic = ["version"]
description = "Fast Sentence Embeddings for Gensim"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Oliver Borchers" }]
keywords = [
    "sentence-embeddings",
    "gensim",
    "word2vec",
    "fasttext",
    "sif",
    "usif",
    "nlp",
    "cython",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "gensim>=4.0",
    "smart_open>=1.8.1",
    "wordfreq>=2.2.1",
    "huggingface-hub>=0.23",
    "psutil>=5.0",
]

[project.urls]
Homepage = "https://www.drborchers.com"
Repository = "https://github.com/oborchers/Fast_Sentence_Embeddings"
Issues = "https://github.com/oborchers/Fast_Sentence_Embeddings/issues"
Changelog = "https://github.com/oborchers/Fast_Sentence_Embeddings/blob/master/CHANGELOG.md"

# --- Build ---

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fse.models" = ["*.pyx", "*.pxd", "*.h"]

[tool.setuptools_scm]
version_file = "src/fse/_version.py"

# --- Dependency Groups ---

[dependency-groups]
dev = [
    "pre-commit>=3.0.0",
]
lint = [
    "ruff>=0.9.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "coverage[toml]>=7.0.0",
]
all = [
    { include-group = "dev" },
    { include-group = "lint" },
    { include-group = "test" },
]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "src/fse/models/*.pyx" },
    { file = "src/fse/models/*.pxd" },
    { git = { commit = true, tags = true } },
]

# --- Ruff ---

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src"]
extend-exclude = ["_version.py", "notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["fse"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- pytest ---

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
xfail_strict = true
markers = ["network: needs access to the Hugging Face Hub"]

# --- Coverage ---

[tool.coverage.run]
source = ["fse"]
branch = true
parallel = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = true

# --- cibuildwheel ---

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *-win32 *_i686"
build-frontend = "build[uv]"
test-groups = ["test"]
test-command = "pytest {project}/tests -m 'not network' -p no:cacheprovider"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
