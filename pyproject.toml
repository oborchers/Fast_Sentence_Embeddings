[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "Cython>=3.1.0", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fse"
dynamic = ["version"]
description = "Fast Sentence Embeddings from word vectors"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Oliver Borchers", email = "26734737+oborchers@users.noreply.github.com" }]
keywords = [
    "sentence-embeddings",
    "gensim",
    "word2vec",
    "fasttext",
    "sif",
    "usif",
    "nlp",
    "cython",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
# Lower bounds are the versions the min-deps CI job tests.
dependencies = [
    "numpy>=1.26.4",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
# The gensim adapter fse.gensim.
gensim = ["gensim>=4.3.3"]

[project.urls]
Homepage = "https://www.drborchers.com"
Repository = "https://github.com/oborchers/Fast_Sentence_Embeddings"
Issues = "https://github.com/oborchers/Fast_Sentence_Embeddings/issues"
Changelog = "https://github.com/oborchers/Fast_Sentence_Embeddings/blob/master/CHANGELOG.md"

# --- Build ---

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fse" = ["py.typed", "*.pyx", "*.pxd", "*.h", "*.pyi"]

[tool.setuptools_scm]
version_file = "src/fse/_version.py"

# --- Dependency Groups ---

[dependency-groups]
dev = [
    "pre-commit>=3.0.0",
    "cibuildwheel>=3.0.0",
    # benchmarks/bench_wordvectors.py finds the hub vectors in the local cache.
    "huggingface-hub>=0.23.0",
]
lint = [
    "ruff>=0.17.2",
    "mypy>=1.18.0",
    # Import contracts of the layers ([tool.importlinter]).
    "import-linter>=2.15",
    # Cognitive complexity for tools/check_guardrails.py; 8.x changes quickly.
    "complexipy>=8.3,<9",
]
test = [
    # The tests of fse.gensim; gensim does not build on Python 3.14 and newer yet (gensim#3640).
    "gensim>=4.3.3; python_version < '3.14'",
    # Checks that the reference implementation reads fse's safetensors files.
    "safetensors>=0.4.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "coverage[toml]>=7.0.0",
]
all = [
    { include-group = "dev" },
    { include-group = "lint" },
    { include-group = "test" },
]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "src/fse/*.pyx" },
    { file = "src/fse/*.pxd" },
    { file = "src/fse/*.h" },
    { git = { commit = true, tags = true } },
]

# --- Ruff ---

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
extend-exclude = ["_version.py", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I", "PLC", "RUF", "PT", "N"]
# N812: numpy dtypes are imported under the conventional uppercase aliases REAL and uINT.
ignore = ["E501", "N812"]

[tool.ruff.lint.isort]
known-first-party = ["fse"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415", "E741"]
# Benchmarks import inside the measured child processes on purpose.
"benchmarks/**" = ["PLC0415"]

# Limits of the complexity rules. They are not in `select`: tools/check_guardrails.py
# runs them and compares the findings with the ratchet in [tool.fse.guardrails].
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# --- mypy ---

[tool.mypy]
python_version = "3.11"
files = ["src/fse"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

# These dependencies ship no type information.
[[tool.mypy.overrides]]
module = ["gensim.*", "safetensors.*", "huggingface_hub.*"]
ignore_missing_imports = true

# --- pytest ---

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
xfail_strict = true
markers = [
    "network: needs access to the Hugging Face Hub",
]
filterwarnings = [
    "error",
]

# --- Coverage ---

[tool.coverage.run]
source = ["fse"]
branch = true
parallel = true
omit = ["*/_version.py"]

[tool.coverage.paths]
source = ["src/fse", "*/src/fse"]

[tool.coverage.report]
precision = 2
# Measured baseline is about 96 percent of the Python code; Cython is not traced.
fail_under = 95
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
    "\\.\\.\\.$",
]

# --- cibuildwheel ---

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-* cp315-*"
skip = "*-musllinux_* *-win32 *_i686"
build-frontend = "build[uv]"
test-groups = ["test"]
# Double quotes, because the Windows shell does not understand single quotes.
test-command = 'pytest {project}/tests -m "not network" -p no:cacheprovider'

[tool.cibuildwheel.linux]
# The Linux tests run in a container; CI makes them require the NEON or AVX2 kernel.
environment-pass = ["CI"]

# --- Guardrails (tools/check_guardrails.py; AGENTS.md, Guardrails) ---

[tool.fse.guardrails]
paths = ["src", "tests", "tools", "benchmarks"]
max-lines = 500
max-cognitive-complexity = 15
# Generated; their generator tools/make_unicode_tables.py is the source.
generated = ["src/fse/_unicode.py", "src/fse/_native_unicode.h"]
# The only modules that import the extension fse._native (import-linter cannot see it).
native-importers = ["src/fse/_text.py"]
# What the extension may import from fse.
native-imports = ["fse._contract"]
# Modules without their own tests/test_<name>.py.
untested-modules = ["src/fse/_validation.py", "src/fse/_version.py"]

# The ratchet: what exceeded a limit when the guardrails came (PR 7b). It only shrinks:
# growth fails, an improvement must lower its number, an entry within the limit must be
# removed. Never add an entry or raise a number; split or simplify the code instead.
[tool.fse.guardrails.ratchet.lines]
"src/fse/_container.py" = 854
"src/fse/_native.pyx" = 1371
"src/fse/_native_kernel.h" = 703
"src/fse/_wordvectors.py" = 712
"tests/test_conformance.py" = 644
"tests/test_container.py" = 550
"tests/test_container_safetensors.py" = 655
"tests/test_wordvectors.py" = 733

[tool.fse.guardrails.ratchet.functions]
"benchmarks/baseline/make_v1_fixture.py::main" = { C901 = 11, cognitive = 39 }
"benchmarks/bench_kernel.py::main" = { cognitive = 22 }
"benchmarks/bench_tokenize.py::child_v2" = { cognitive = 19 }
"benchmarks/bench_tokenize.py::main" = { C901 = 17, PLR0915 = 59, cognitive = 40 }
"benchmarks/bench_tokenize.py::prepare" = { cognitive = 18 }
"benchmarks/bench_wordvectors.py::child" = { C901 = 13 }
"benchmarks/quality/run_mteb.py::summarize" = { cognitive = 39 }
"src/fse/_codes.py::quantize_into" = { PLR0913 = 6, cognitive = 24 }
"src/fse/_container.py::SafetensorsContainer.open" = { cognitive = 22 }
"src/fse/_container.py::SafetensorsContainer.write" = { C901 = 13, PLR0915 = 54, cognitive = 24 }
"src/fse/_container.py::_check_for_writing" = { cognitive = 16 }
"src/fse/_container.py::_read_header" = { C901 = 11 }
"src/fse/_container.py::_read_manifest" = { C901 = 15, PLR0912 = 14, cognitive = 26 }
"src/fse/_container.py::_read_safetensors_header" = { C901 = 20, PLR0912 = 19, PLR0915 = 52, cognitive = 33 }
"src/fse/_contract.py::check_steps" = { cognitive = 16 }
"src/fse/_reference.py::accumulate" = { PLR0913 = 7, PLR0917 = 7, cognitive = 30 }
"src/fse/_reference.py::pool_groups" = { PLR0913 = 8, PLR0917 = 8 }
"src/fse/_reference.py::pool_weighted_mean" = { PLR0913 = 7, PLR0917 = 7 }
"src/fse/_reference_text.py::_token_chars" = { cognitive = 17 }
"src/fse/_reference_text.py::encode_texts" = { PLR0913 = 6 }
"src/fse/_reference_text.py::ft_ngram_hashes" = { cognitive = 21 }
"src/fse/_reference_text.py::tokenize_fse_words" = { cognitive = 18 }
"src/fse/_wordvectors.py::WordVectors.from_arrays" = { C901 = 14, PLR0912 = 13, PLR0913 = 9, cognitive = 25 }
"src/fse/_wordvectors.py::WordVectors.quantize" = { C901 = 11, cognitive = 26 }
"src/fse/_wordvectors.py::_check_structure" = { C901 = 22, PLR0912 = 21, PLR0915 = 58, cognitive = 34 }
"src/fse/_wordvectors.py::_check_values" = { C901 = 12, cognitive = 31 }
"src/fse/gensim.py::from_gensim" = { C901 = 13, PLR0912 = 13, cognitive = 19 }
"tests/test_conformance.py::_numpy_pool" = { cognitive = 16 }
"tests/test_conformance.py::_random_case" = { PLR0913 = 9 }
"tests/test_conformance.py::test_v1_fixture_batches" = { cognitive = 20 }
"tests/test_wordvectors.py::_wv" = { PLR0913 = 6, PLR0917 = 6 }

# --- Import contracts (import-linter; the Cython extension is invisible to it and is
# checked by tools/check_guardrails.py) ---

[tool.importlinter]
root_package = "fse"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers (ARCHITECTURE.md, Layout): a module imports only from layers below it"
type = "layers"
containers = ["fse"]
# Every new module must be placed in a layer.
exhaustive = true
exhaustive_ignores = ["_version"]
layers = [
    "gensim",
    "_text",
    "_wordvectors",
    # Independent of each other: the references never share code with what they check.
    "_container | _codes | _gram | _reference | _reference_text | _validation",
    "_contract | _unicode",
]

[[tool.importlinter.contracts]]
name = "Optional and 1.x packages stay out of fse; gensim only in fse.gensim"
type = "forbidden"
source_modules = ["fse"]
forbidden_modules = ["gensim", "scipy", "smart_open", "psutil", "threadpoolctl", "wordfreq", "mlx", "torch", "sklearn"]
ignore_imports = ["fse.gensim -> gensim"]
