[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "Cython>=3.1.0", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fse"
dynamic = ["version"]
description = "Fast Sentence Embeddings from word vectors"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Oliver Borchers", email = "26734737+oborchers@users.noreply.github.com" }]
keywords = [
    "sentence-embeddings",
    "gensim",
    "word2vec",
    "fasttext",
    "sif",
    "usif",
    "nlp",
    "cython",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
# Lower bounds are the versions the min-deps CI job tests.
dependencies = [
    "numpy>=1.26.4",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
# The gensim adapter fse.gensim.
gensim = ["gensim>=4.3.3"]

[project.urls]
Homepage = "https://www.drborchers.com"
Repository = "https://github.com/oborchers/Fast_Sentence_Embeddings"
Issues = "https://github.com/oborchers/Fast_Sentence_Embeddings/issues"
Changelog = "https://github.com/oborchers/Fast_Sentence_Embeddings/blob/master/CHANGELOG.md"

# --- Build ---

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fse" = ["py.typed", "*.pyx", "*.pxd", "*.h", "*.pyi"]

[tool.setuptools_scm]
version_file = "src/fse/_version.py"

# --- Dependency Groups ---

[dependency-groups]
dev = [
    "pre-commit>=3.0.0",
    "cibuildwheel>=3.0.0",
    # benchmarks/bench_wordvectors.py finds the hub vectors in the local cache.
    "huggingface-hub>=0.23.0",
]
lint = [
    "ruff>=0.17.2",
    "mypy>=1.18.0",
]
test = [
    # The tests of fse.gensim; gensim does not build on Python 3.14 and newer yet (gensim#3640).
    "gensim>=4.3.3; python_version < '3.14'",
    # Checks that the reference implementation reads fse's safetensors files.
    "safetensors>=0.4.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "coverage[toml]>=7.0.0",
]
all = [
    { include-group = "dev" },
    { include-group = "lint" },
    { include-group = "test" },
]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "src/fse/*.pyx" },
    { file = "src/fse/*.pxd" },
    { file = "src/fse/*.h" },
    { git = { commit = true, tags = true } },
]

# --- Ruff ---

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
extend-exclude = ["_version.py", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I", "PLC", "RUF", "PT", "N"]
# N812: numpy dtypes are imported under the conventional uppercase aliases REAL and uINT.
ignore = ["E501", "N812"]

[tool.ruff.lint.isort]
known-first-party = ["fse"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415", "E741"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# --- mypy ---

[tool.mypy]
python_version = "3.11"
files = ["src/fse"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

# These dependencies ship no type information.
[[tool.mypy.overrides]]
module = ["gensim.*", "safetensors.*", "huggingface_hub.*"]
ignore_missing_imports = true

# --- pytest ---

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
xfail_strict = true
markers = [
    "network: needs access to the Hugging Face Hub",
]
filterwarnings = [
    "error",
]

# --- Coverage ---

[tool.coverage.run]
source = ["fse"]
branch = true
parallel = true
omit = ["*/_version.py"]

[tool.coverage.paths]
source = ["src/fse", "*/src/fse"]

[tool.coverage.report]
precision = 2
# Measured baseline is about 96 percent of the Python code; Cython is not traced.
fail_under = 95
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
    "\\.\\.\\.$",
]

# --- cibuildwheel ---

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-* cp315-*"
skip = "*-musllinux_* *-win32 *_i686"
build-frontend = "build[uv]"
test-groups = ["test"]
# Double quotes, because the Windows shell does not understand single quotes.
test-command = 'pytest {project}/tests -m "not network" -p no:cacheprovider'

[tool.cibuildwheel.linux]
# The Linux tests run in a container; CI makes them require the NEON or AVX2 kernel.
environment-pass = ["CI"]
