[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "Cython>=3.1.0", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fse"
dynamic = ["version"]
description = "Fast Sentence Embeddings from word vectors"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Oliver Borchers", email = "26734737+oborchers@users.noreply.github.com" }]
keywords = [
    "sentence-embeddings",
    "gensim",
    "word2vec",
    "fasttext",
    "sif",
    "usif",
    "nlp",
    "cython",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
# Lower bounds are the versions the min-deps CI job tests.
dependencies = [
    "numpy>=1.26.4",
    "pydantic>=2.5.0",
    "xxhash>=3.2.0",
    # The Hugging Face Hub of Encoder.from_pretrained; fse._hub imports it on first use only,
    # so `import fse` and local models never load it.
    "huggingface-hub>=1.0",
]

[project.optional-dependencies]
# The gensim adapter fse.gensim.
gensim = ["gensim>=4.3.3"]
# The MLX backend (backend="mlx"): Metal on Apple silicon, macOS 14 and newer. 0.32.4 is
# the version its kernels were verified on (compile options since 0.32.0, zero-copy input
# since 0.32.1, thread safety since 0.31.2).
mlx = ["mlx>=0.32.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.urls]
Homepage = "https://www.drborchers.com"
Repository = "https://github.com/oborchers/Fast_Sentence_Embeddings"
Issues = "https://github.com/oborchers/Fast_Sentence_Embeddings/issues"
Changelog = "https://github.com/oborchers/Fast_Sentence_Embeddings/blob/master/CHANGELOG.md"

# --- Build ---

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fse" = [
    "py.typed", "*.pyx", "*.pxi", "*.pxd", "*.h", "*.pyi",
    "_native_src/*.pxi", "_native_src/*.h",
    "_native_src/*/*.pxi", "_native_src/*/*.h",
]

[tool.setuptools_scm]
version_file = "src/fse/_version.py"

# --- Dependency Groups ---

[dependency-groups]
dev = [
    "pre-commit>=3.0.0",
    "cibuildwheel==4.3.4",
    # Profilers for every gate (AGENTS.md, Commands): py-spy samples the CPU with native
    # frames on Linux; memray traces allocations, native ones too, on macOS and Linux.
    # samply (CPU on macOS without root) is a system tool: cargo install samply.
    "py-spy>=0.4.0",
    "memray>=1.17; sys_platform != 'win32'",
]
lint = [
    "ruff>=0.17.2",
    "mypy>=1.18.0",
    # Import contracts of the layers ([tool.importlinter]).
    "import-linter>=2.15",
    # Cognitive complexity for tools/check_guardrails.py; 8.x changes quickly.
    "complexipy>=8.3,<9",
    # Unused code ([tool.vulture] lists what Python, pytest or a library uses by name) and
    # dependencies that pyproject.toml declares but nothing imports, or the reverse.
    "vulture>=2.14",
    "deptry>=0.23",
]
test = [
    # The tests of fse.gensim; gensim does not build on Python 3.14 and newer yet (gensim#3640).
    "gensim>=4.3.3; python_version < '3.14'",
    # Checks that the reference implementation reads fse's safetensors files.
    "safetensors>=0.4.0",
    # The tests of Classifier.from_sklearn and Regressor.from_sklearn (fse never imports it).
    "scikit-learn>=1.5.0",
    # The reference of wordpiece@1 against Hugging Face tokenizers. Pinned exactly: its
    # lowercase is the Unicode of the Rust that built the wheel (17.0.0 for 0.23.3), so a
    # newer wheel can change ids, and the exhaustive tests then name the code points.
    "tokenizers==0.23.3",
    # The vectors of Model2Vec models against model2vec's own encode. Pinned exactly: the
    # rules the reader reproduces (cuts, unknown ids, normalize) are those of 0.10.0.
    "model2vec==0.10.0",
    # Producers of Arrow string columns for the tests of Arrow input (fse imports none of
    # them; it reads the PyCapsule interface). Pinned exactly, each where it has wheels, so
    # that `uv sync --group test` never builds them; the tests skip where one is missing.
    "pyarrow==26.0.0; python_version < '3.16'",
    "pandas==3.1.0; python_version < '3.16'",
    "polars==2.1.0; python_version < '3.16'",
    "datasets==5.1.0; python_version < '3.16'",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    # Runs the tests in worker processes (make test, PYTEST_N). Since 3.6.1 (3.6.0 was
    # yanked) a worker runs every test in its main thread, which the SIGINT tests need
    # (signal.signal), and pytest-cov does not deadlock.
    "pytest-xdist>=3.6.1",
    "coverage[toml]>=7.0.0",
]
# The vectors of sentence-transformers models against sentence-transformers' own encode
# (make test-st, the CI job test-st). A group of its own: it needs huggingface-hub 1.3 or
# newer, below the minimum job's 1.0, and torch, which comes from the CPU index of
# PyTorch on every platform (no CUDA libraries). Pinned exactly: the rules the reader
# reproduces are those of sentence-transformers 6.2.0.
st = ["sentence-transformers==6.2.0", "torch==2.15.0"]
# The MLX backend for its tests (make test-mlx); only on Apple silicon.
mlx = ["mlx>=0.32.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]
all = [
    { include-group = "dev" },
    { include-group = "lint" },
    { include-group = "test" },
]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "src/fse/*.pyx" },
    { file = "src/fse/*.pxi" },
    { file = "src/fse/*.pxd" },
    { file = "src/fse/*.h" },
    { file = "src/fse/_native_src/**/*.pxi" },
    { file = "src/fse/_native_src/**/*.h" },
    { git = { commit = true, tags = true } },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

# --- Ruff ---

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["_version.py"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I", "PLC", "RUF", "PT", "N", "ARG"]
# N812: numpy dtypes are imported under the conventional uppercase aliases REAL and uINT.
ignore = ["E501", "N812"]

[tool.ruff.lint.isort]
known-first-party = ["fse"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415", "E741"]
# Benchmarks import inside the measured child processes on purpose.
"benchmarks/**" = ["PLC0415"]
# The encoder adapter implements the signature MTEB calls, whose arguments it ignores.
"benchmarks/quality/run_mteb.py" = ["PLC0415", "ARG002"]

# Limits of the complexity rules. They are not in `select`: tools/check_guardrails.py
# runs them and compares the findings with the ratchet in [tool.fse.guardrails].
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 15
max-positional-args = 15
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# --- mypy ---

[tool.mypy]
python_version = "3.11"
files = ["src/fse"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

# These dependencies ship no type information.
[[tool.mypy.overrides]]
module = ["gensim.*", "safetensors.*", "huggingface_hub.*", "mlx.*"]
ignore_missing_imports = true

# --- pytest ---

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/support holds helpers the test modules share; test modules never import each other.
pythonpath = ["tests"]
python_files = "test_*.py"
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
xfail_strict = true
markers = [
    "network: needs access to the Hugging Face Hub",
    "expected_log(*events): WARNING records of these fse events do not fail the test",
]
filterwarnings = [
    "error",
    # torch (group st, the comparisons with sentence-transformers) warns on import on a
    # GitHub macOS runner, whose paravirtual GPU has no Metal 2.0; fse does not use MPS.
    "ignore:Skipping device Apple Paravirtual device that does not support Metal 2.0:UserWarning",
]

# --- Coverage ---

[tool.coverage.run]
source = ["fse"]
branch = true
parallel = true
omit = ["*/_version.py"]

[tool.coverage.paths]
source = ["src/fse", "*/src/fse"]

[tool.coverage.report]
precision = 2
# Measured baseline is about 96 percent of the Python code; Cython is not traced.
fail_under = 95
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
    "\\.\\.\\.$",
]

# --- cibuildwheel ---

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-* cp315-*"
skip = "*-win32 *_i686"
build-frontend = "build[uv]"
test-groups = ["test"]
# Double quotes, because the Windows shell does not understand single quotes.
test-command = 'pytest {project}/tests -m "not network" -p no:cacheprovider -n auto'

[tool.cibuildwheel.linux]
# The Linux tests run in a container; CI makes them require the NEON or AVX2 kernel.
environment-pass = ["CI"]

# Exact image digests from cibuildwheel v4.3.4, dated 2026.10.21-1.
# https://github.com/pypa/cibuildwheel/blob/v4.3.4/cibuildwheel/resources/pinned_docker_images.cfg
manylinux-x86_64-image = "quay.io/pypa/manylinux_2_28_x86_64@sha256:b74a5b6f1705ecff17be8bd792589bef9b3b039766d12205720ecd2a9e919192"
manylinux-aarch64-image = "quay.io/pypa/manylinux_2_28_aarch64@sha256:0333f44c4eb759ec8f47b27bc9dc27b1c929932a267cf13ce0cff1a4b758cccb"
musllinux-x86_64-image = "quay.io/pypa/musllinux_1_2_x86_64@sha256:767e9118e48b4b8de84d3262ba95a3bc5f6679a09247f0bf9e283445608f37c1"
musllinux-aarch64-image = "quay.io/pypa/musllinux_1_2_aarch64@sha256:0a7b18a1fce3dcfb1a6dd2ac99f077b78fb0f3cec8a2fed65bb999823c6a8fa0"

[[tool.cibuildwheel.overrides]]
select = "*-musllinux_*"
# gensim and scikit-learn have no musllinux wheels. Keep the Arrow producers and
# Model2Vec parity tests. Exclude gensim explicitly; sklearn uses importorskip.
test-groups = []
test-requires = [
    "pytest>=8.0.0", "pytest-xdist>=3.6.1", "safetensors>=0.4.0",
    "tokenizers==0.23.3", "model2vec==0.10.0", "pyarrow==26.0.0",
    "pandas==3.1.0", "polars==2.1.0", "datasets==5.1.0",
]
test-command = 'pytest {project}/tests -m "not network" -p no:cacheprovider -n auto --ignore={project}/tests/test_gensim.py -k "not test_ft_ngram_hashes_match_gensim_on_random_unicode"'
# PyYAML (a Hub dependency) builds from source on CPython 3.15 musllinux.

# --- Guardrails (tools/check_guardrails.py; AGENTS.md, Guardrails) ---

[tool.fse.guardrails]
paths = ["src", "tests", "tools", "benchmarks", "media", "setup.py"]
max-lines = 500
max-cognitive-complexity = 15
# Generated; their generators tools/make_unicode_tables.py, tools/make_wordpiece_tables.py and
# tools/make_grapheme_tables.py are the source.
generated = [
    "src/fse/_unicode.py",
    "src/fse/_native_src/tables/_native_unicode.h",
    "src/fse/_unicode_bert.py",
    "src/fse/_native_src/tables/_native_unicode_bert.h",
    "src/fse/_unicode_graphemes.py",
    "src/fse/_native_src/tables/_native_unicode_graphemes.h",
]
# The only modules that import the extension fse._native (import-linter cannot see it):
# the package _text for stages 1 and 2, the cpu backend for the kernels of stages 2 to 4.
native-importers = [
    "src/fse/_text/_arrow.py",
    "src/fse/_text/_lookup.py",
    "src/fse/_text/_scan.py",
    "src/fse/_text/_strings.py",
    "src/fse/_backends/_cpu.py",
]
# What the extension may import from fse.
native-imports = ["fse._contract"]
# The only module that imports a hash library (hashlib, xxhash): every checksum and
# fingerprint of fse is xxh3-128 through it (docs/architecture/persistence.md, "Identities").
hash-importers = ["src/fse/_container/_hash.py"]
hash-modules = ["hashlib", "xxhash"]
# The only modules that import logging or warnings: fse logs through fse._log
# (docs/architecture/logging.md, "Logging"); if one of them splits, its parts join the list.
log-importers = ["src/fse/_log.py", "src/fse/_log_config.py"]
log-modules = ["logging", "warnings"]
# What the MLX device thread runs: it never logs, so none of these imports fse._log.
log-free = [
    "src/fse/_backends/_mlx/_canary.py",
    "src/fse/_backends/_mlx/_kernels.py",
    "src/fse/_backends/_mlx/_sources.py",
    "src/fse/_backends/_mlx/_load.py",
    "src/fse/_backends/_mlx/_bounds.py",
]
# The device library of each device backend, by backend name: only
# src/fse/_backends/_<name>/_load.py imports it; get_backend imports that backend lazily,
# so `import fse` never does.
device-libraries = { mlx = ["mlx"] }
# Modules without their own tests/test_<name>.py.
# _version.py is generated by setuptools-scm.
untested-modules = ["src/fse/_version.py"]

# The ratchet: what exceeded a limit when the guardrails came (PR 7b). It only shrinks:
# growth fails, an improvement must lower its number, an entry within the limit must be
# removed. Never add an entry or raise a number; split or simplify the code instead.
[tool.fse.guardrails.ratchet.lines]

[tool.fse.guardrails.ratchet.functions]
"benchmarks/baseline/make_v1_fixture.py::main" = { C901 = 11, cognitive = 39 }
"benchmarks/bench_kernel.py::main" = { cognitive = 22 }
"benchmarks/bench_tokenize.py::child_v2" = { cognitive = 19 }
"benchmarks/bench_tokenize.py::main" = { C901 = 17, PLR0915 = 59, cognitive = 40 }
"benchmarks/bench_tokenize.py::prepare" = { cognitive = 18 }
"benchmarks/bench_wordvectors.py::child" = { C901 = 13 }
"benchmarks/quality/run_mteb.py::summarize" = { cognitive = 39 }

# --- Import contracts (import-linter; the Cython extension is invisible to it and is
# checked by tools/check_guardrails.py) ---

[tool.importlinter]
root_package = "fse"
include_external_packages = true
# Imports for type checkers only (fse/__init__.py names the lazily loaded encoder).
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Layers (docs/architecture/process.md, Layout): a module imports only from layers below it"
type = "layers"
containers = ["fse"]
# Every new module must be placed in a layer.
exhaustive = true
exhaustive_ignores = ["_version"]
layers = [
    # Linear heads on an encoder; they read stores in store mode.
    "_head",
    # The store takes an Encoder; fse.gensim only converts word vectors; the static model
    # is the API of model2vec on Encoders.
    "gensim | _store | _static_model",
    "_encoder",
    # Pushes a model folder to the Hub in one checked commit, on fse._hub.
    "_hub_push",
    "_runtime",
    # Independent: _backends computes on batches, _stream and _text_file read sentences.
    "_backends | _stream | _text_file | _hub",
    "_text",
    "_wordvectors",
    "_wordvectors_format | _tokenizer_json",
    "_tokenizer_json_unigram",
    # What the readers of a tokenizer.json share.
    "_tokenizer_json_common",
    # The reference of linear heads builds on the reference of the encoder (fma32, dot16),
    # that of unigram@1 on the added tokens of wordpiece@1.
    "_reference_head | _reference_unigram | _log_config",
    # Independent of each other: the references never share code with what they check.
    "_container | _codes | _reference | _reference_text | _reference_wordpiece | _tokenizer_spec | _validation",
    # The parameters of unigram@1, which TokenizerSpec holds.
    "_tokenizer_unigram",
    "_contract | _cpus | _unicode | _unicode_bert | _unicode_graphemes | _charsmap",
    # The records of fse (docs/architecture/logging.md, "Logging"), which every module may emit.
    "_log",
]

[[tool.importlinter.contracts]]
name = "Containers: npy and safetensors share only _common, all of them hash with _hash; the foreign reader sits on safetensors"
type = "layers"
containers = ["fse._container"]
exhaustive = true
layers = ["_npy_inplace | _foreign", "_npy | _safetensors", "_common", "_hash"]

[[tool.importlinter.contracts]]
name = "Store: the sink and the vector store on shards, the shards on the layout"
type = "layers"
containers = ["fse._store"]
exhaustive = true
layers = ["_sink | _vectorstore", "_shard | _writer | _search", "_layout"]

[[tool.importlinter.contracts]]
name = "Backends: each shares only _base with the others"
type = "layers"
containers = ["fse._backends"]
exhaustive = true
layers = ["_cpu | _numpy | _mlx", "_base"]

[[tool.importlinter.contracts]]
name = "MLX: the backend on the device thread, that on the kernels, those on the sources"
type = "layers"
containers = ["fse._backends._mlx"]
exhaustive = true
layers = ["_backend", "_device", "_canary", "_kernels", "_sources | _load | _bounds"]

[[tool.importlinter.contracts]]
name = "Heads: the classes on the model, that on its runs, the readers and formats on the content"
type = "layers"
containers = ["fse._head"]
exhaustive = true
layers = ["_classifier | _regressor", "_model", "_run", "_sklearn | _format | _outputs", "_content"]

[[tool.importlinter.contracts]]
name = "Encoder: the encoder on its batches and format, those on its inputs"
type = "layers"
containers = ["fse._encoder"]
exhaustive = true
layers = ["_encoder | _model2vec_rules", "_pretrained | _persist", "_folder", "_card", "_model2vec | _sentence_transformers", "_files", "_batches | _format", "_format_tokenizer", "_sources", "_inputs"]

[[tool.importlinter.contracts]]
name = "Static model: the class on the loading, the encoders, the tokenizer and the saving, those on the profile and the ids, those on the arguments"
type = "layers"
containers = ["fse._static_model"]
exhaustive = true
layers = ["_model", "_load | _variants | _tokenizer | _save", "_profile | _ids", "_arguments"]

[[tool.importlinter.contracts]]
name = "Text: the sources and the lookup on the scan of one buffer"
type = "layers"
containers = ["fse._text"]
exhaustive = true
layers = ["_arrow | _strings | _lookup", "_scan", "_plan"]

[[tool.importlinter.contracts]]
name = "Runtime: a head on pipelines, the pipeline on tasks, sinks and the executor"
type = "layers"
containers = ["fse._runtime"]
exhaustive = true
layers = ["_head", "_pipeline", "_tasks | _sinks | _executor | _spec | _errors"]

[[tool.importlinter.contracts]]
# The device libraries (mlx) are checked by tools/check_guardrails.py instead: only the
# loader of their backend imports them ([tool.fse.guardrails] device-libraries).
name = "Optional and 1.x packages and the Arrow producers stay out of fse; gensim only in fse.gensim"
type = "forbidden"
source_modules = ["fse"]
forbidden_modules = ["gensim", "scipy", "smart_open", "psutil", "threadpoolctl", "wordfreq", "torch", "sklearn", "pyarrow", "pandas", "polars", "datasets", "nanoarrow"]
ignore_imports = ["fse.gensim -> gensim"]

# --- Unused code and dependencies (make lint) ---

[tool.vulture]
paths = ["src/fse", "tools", "tests", "benchmarks"]
min_confidence = 60
ignore_names = [
    "__getattr__",       # the module hooks of fse/__init__.py, called by Python
    "__dir__",
    "exc",               # the arguments of __exit__
    "pytestmark",        # read by pytest
    "pytest_runtest_setup",     # hooks of tests/conftest.py, called by pytest
    "pytest_runtest_call",
    "pytest_runtest_teardown",
    "import_errors",     # called by tools/check_guardrails.py, which loads its module by path
    "windows_file_maps", # a fixture used through pytest.mark.usefixtures
    "python_sigint",     # a fixture used through pytest.mark.usefixtures
    "broken_logging",    # a fixture used through pytest.mark.usefixtures
    "normalizer",        # attributes of a Hugging Face tokenizer, read by tokenizers
    "pre_tokenizer",
    "post_processor",
    "hf_split",          # arguments of the MTEB encoder interface
    "hf_subset",
    "prompt_type",
    "_fields_",          # the layout of a ctypes struct, read by ctypes (tests/support/arrow_c.py)
    "n_children",        # fields of the Arrow C structs there, read by the extension
]

[tool.deptry]
known_first_party = ["fse"]

[tool.deptry.package_module_name_map]
pytest-cov = "pytest_cov"
