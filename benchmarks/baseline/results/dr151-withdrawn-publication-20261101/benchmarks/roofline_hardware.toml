kind = "spec"
source = "Apple Newsroom, 30.10.2024: M4 Pro '273GB/s of memory bandwidth', https://www.apple.com/newsroom/2024/10/apple-introduces-m4-pro-and-m4-max/"

["runpod-epyc-9655p"]
p_cores = 96  # host physical cores, not the pod's allocated logical CPUs
e_cores = 0
l2_cluster_bytes = 0  # no calibrated cache-sharing model for the pod allocation
topology_source = "lscpu on RunPod, 31.10.2026: AMD EPYC 9655P, one socket, 96 physical cores, two threads per core; pod affinity contains 32 logical CPUs, cpu.max is max 100000, memory.max is 64000000000; physical sibling placement within the allocation was not recorded"
measured = true
notes = [
    "Observed shared-host pod configuration, not a specification or a stable machine-wide bandwidth guarantee; host load during the probe was 8.46 to 8.91.",
    "p_cores describes host topology. Per-core and Amdahl predictions are not calibrated for the pod cpuset or SMT placement; use the measured bandwidth references independently.",
    "One probe series, fastest of three measured passes after warm-up. A second pod used a different CPU (EPYC 9B45) at host load above 1000 and is only a host/load variation comparison.",
    "Compact evidence and limitations (with pinned raw archive link): benchmarks/baseline/dr190_runpod_20261031.json and PERFORMANCE.md, RunPod Linux x86 observations.",
]

