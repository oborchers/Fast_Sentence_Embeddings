<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="575" viewBox="0 0 1100 575" role="img" aria-labelledby="title desc"><title id="title">Classification: fold the linear head</title><desc id="desc">A trained linear head turns each word vector into class scores once. For each new text, fse looks up those word scores, averages them, adds the bias and returns labels. This applies to heads trained on raw unnormalized averages when only class outputs are needed. Standalone saving preserves that same folded table. Speed measurements are pending.</desc><rect width="1100" height="575" rx="12" fill="#FAFAF8"/><g font-family="Geist, Arial, sans-serif">
<text x="40" y="52" font-size="30" fill="#1E1B18" font-weight="700" text-anchor="start">Classification: fold the linear head</text>
<text x="40" y="84" font-size="19" fill="#4F463E" font-weight="400" text-anchor="start">Compute word scores once. Reuse them for each text.</text>
<text x="40" y="128" font-size="15" fill="#2D6A4F" font-weight="700" text-anchor="start">PREPARE ONCE</text>
<text x="40" y="286" font-size="15" fill="#2D6A4F" font-weight="700" text-anchor="start">PREDICT REPEATEDLY</text>
<rect x="40" y="146" width="250" height="85" rx="12" fill="#F0EBE3" stroke="#E0D9CF"/>
<text x="165.0" y="181" font-size="22" fill="#1E1B18" font-weight="700" text-anchor="middle">Word vectors</text>
<text x="165.0" y="208" font-size="16" fill="#4F463E" font-weight="400" text-anchor="middle">the finished encoder table</text>
<rect x="360" y="146" width="285" height="85" rx="12" fill="#F0EBE3" stroke="#E0D9CF"/>
<text x="502.5" y="181" font-size="22" fill="#1E1B18" font-weight="700" text-anchor="middle">Trained linear head</text>
<text x="502.5" y="208" font-size="16" fill="#4F463E" font-weight="400" text-anchor="middle">apply its weights per word</text>
<rect x="755" y="146" width="305" height="85" rx="12" fill="#F0EBE3" stroke="#E0D9CF"/>
<text x="907.5" y="181" font-size="22" fill="#1E1B18" font-weight="700" text-anchor="middle">Word-score table</text>
<text x="907.5" y="208" font-size="16" fill="#4F463E" font-weight="400" text-anchor="middle">ready for new texts</text>
<rect x="40" y="307" width="180" height="85" rx="12" fill="#F0EBE3" stroke="#E0D9CF"/>
<text x="130.0" y="342" font-size="22" fill="#1E1B18" font-weight="700" text-anchor="middle">New texts</text>
<text x="130.0" y="369" font-size="16" fill="#4F463E" font-weight="400" text-anchor="middle">your input</text>
<rect x="285" y="307" width="245" height="85" rx="12" fill="#F0EBE3" stroke="#E0D9CF"/>
<text x="407.5" y="342" font-size="22" fill="#1E1B18" font-weight="700" text-anchor="middle">Look up scores</text>
<text x="407.5" y="369" font-size="16" fill="#4F463E" font-weight="400" text-anchor="middle">for the words in each text</text>
<rect x="595" y="307" width="220" height="85" rx="12" fill="#F0EBE3" stroke="#E0D9CF"/>
<text x="705.0" y="342" font-size="22" fill="#1E1B18" font-weight="700" text-anchor="middle">Average + bias</text>
<text x="705.0" y="369" font-size="16" fill="#4F463E" font-weight="400" text-anchor="middle">combine the word scores</text>
<rect x="880" y="307" width="180" height="85" rx="12" fill="#F0EBE3" stroke="#E0D9CF"/>
<text x="970.0" y="342" font-size="22" fill="#1E1B18" font-weight="700" text-anchor="middle">Labels</text>
<text x="970.0" y="369" font-size="16" fill="#4F463E" font-weight="400" text-anchor="middle">your predictions</text>
<path d="M305 188 H345" fill="none" stroke="#2D6A4F" stroke-width="3"/>
<path d="M660 188 H740" fill="none" stroke="#2D6A4F" stroke-width="3"/>
<path d="M235 350 H270" fill="none" stroke="#2D6A4F" stroke-width="3"/>
<path d="M545 350 H580" fill="none" stroke="#2D6A4F" stroke-width="3"/>
<path d="M830 350 H865" fill="none" stroke="#2D6A4F" stroke-width="3"/>
<path d="M908 246 V271 H408 V292" fill="none" stroke="#2D6A4F" stroke-width="3"/>
<path d="M336 182 L345 188 L336 194" fill="none" stroke="#2D6A4F" stroke-width="3"/>
<path d="M731 182 L740 188 L731 194" fill="none" stroke="#2D6A4F" stroke-width="3"/>
<path d="M261 344 L270 350 L261 356" fill="none" stroke="#2D6A4F" stroke-width="3"/>
<path d="M571 344 L580 350 L571 356" fill="none" stroke="#2D6A4F" stroke-width="3"/>
<path d="M856 344 L865 350 L856 356" fill="none" stroke="#2D6A4F" stroke-width="3"/>
<path d="M402 283 L408 292 L414 283" fill="none" stroke="#2D6A4F" stroke-width="3"/>
<text x="40" y="438" font-size="17" fill="#4F463E" font-weight="400" text-anchor="start">For linear heads trained on raw, unnormalized averages and predicting only class outputs.</text>
<text x="40" y="468" font-size="17" fill="#4F463E" font-weight="400" text-anchor="start">With fewer scores than vector values, each word contributes a shorter list of numbers.</text>
<text x="40" y="498" font-size="17" fill="#4F463E" font-weight="400" text-anchor="start">Standalone saving keeps this table. It is not another speed optimization.</text>
<text x="40" y="546" font-size="18" fill="#2D6A4F" font-weight="700" text-anchor="start">Classification speed: pending controlled measurements. No rate or speedup is claimed.</text>
</g></svg>
