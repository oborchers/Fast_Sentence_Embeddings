[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fse-haystack"
version = "0.2.0"
description = "fse embeddings for haystack-ai"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["fse>=2.1.0,<3", "numpy>=1.26.4", "haystack-ai>=3.4.1"]

[project.urls]
Repository = "https://github.com/oborchers/Fast_Sentence_Embeddings"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-socket>=0.7", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
markers = ["network: downloads a model from the Hugging Face Hub"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
