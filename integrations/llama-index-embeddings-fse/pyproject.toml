[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llama-index-embeddings-fse"
version = "0.1.0.dev0"
description = "fse embeddings for llama-index-core"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["fse>=2.0.0.dev0", "llama-index-core>=0.14.25"]

[project.urls]
Repository = "https://github.com/oborchers/Fast_Sentence_Embeddings"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "numpy>=1.26.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]
markers = ["network: downloads a model from the Hugging Face Hub"]
