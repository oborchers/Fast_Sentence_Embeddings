default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: ["--branch", "master"]
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-toml
      - id: end-of-file-fixer
        exclude: ^(evaluation|notebooks|tests/test_data)/
      - id: trailing-whitespace
        exclude: ^(evaluation|notebooks|tests/test_data)/
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(src|tests|tools|benchmarks)/
      - id: ruff-format
        files: ^(src|tests|tools|benchmarks)/

  - repo: local
    hooks:
      - id: import-linter
        name: import contracts
        entry: uv run --no-sync lint-imports --no-cache
        language: system
        pass_filenames: false
        files: ^(src/|pyproject\.toml$)
      - id: guardrails
        name: guardrails
        entry: uv run --no-sync python tools/check_guardrails.py
        language: system
        pass_filenames: false
        # The paths of [tool.fse.guardrails].
        files: ^(src|tests|tools|benchmarks|media)/|^(setup\.py|pyproject\.toml)$
      - id: vulture
        name: unused code
        entry: uv run --no-sync vulture
        language: system
        pass_filenames: false
        files: ^(src|tests|tools|benchmarks)/|^pyproject\.toml$
      - id: deptry
        name: dependencies
        entry: uv run --no-sync deptry src
        language: system
        pass_filenames: false
        files: ^src/|^pyproject\.toml$
